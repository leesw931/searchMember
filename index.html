<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>명랑 회원 검색</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 25px 15px;
    color: #333;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.status {
    font-size: 13px;
    color: #666;
    margin-bottom: 15px;
}

.search-area {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

button {
    border: none;
    padding: 12px 22px;
    background: #2563eb;
    color: white;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.search-guide {
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
}

.result-count {
    font-weight: bold;
    margin-bottom: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
}

th, td {
    padding: 13px 8px;
    border-bottom: 1px solid #eee;
}

th {
    background: #f1f5f9;
}

.admin {
    color: #8e44ad;
    font-weight: bold;
    background-color: #f3e5f5;
}
.member {
    color: #16a34a;
    font-weight: bold;
}
.non-member {
    color: #dc2626;
    font-weight: bold;
}
.empty {
    text-align: center;
    padding: 25px;
    color: #888;
}

@media(max-width: 480px) {

    .container {

        padding: 18px;

    }

    button {

        padding: 12px 15px;

    }

}

</style>

</head>

<body>

<div class="container">

    <h2>명랑 회원 검색</h2>
    <div class="status" id="fileStatus">

        회원 데이터를 불러오는 중입니다...

    </div>

    <div class="search-area">

        <input

            type="text"

            id="searchWord"

            placeholder="닉네임 또는 이름 입력"

        >

        <button onclick="searchMember()">검색</button>

    </div>

    <div class="search-guide">

        * 여러 명 검색 시 쉼표(,)로 구분하세요
        <br>
        * 닉네임이나 이름의 일부만 입력해도 검색 가능합니다
        <br>
        예: 존람,보비스,홍길동,홍길
    </div>
    <div class="result-count" id="resultCount">

        검색 결과 0건

    </div>

    <table>

        <thead>

            <tr>

                <th>닉네임</th>

                <th>이름</th>

                <th>정회원 여부</th>

            </tr>

        </thead>

        <tbody id="resultBody">

            <tr>

                <td colspan="3" class="empty">

                    검색어를 입력해주세요.

                </td>

            </tr>

        </tbody>

    </table>

</div>

<script>

let memberList = [];

let dataLoaded = false;

// 회원 데이터 자동 로드

async function loadMemberData() {

    const status = document.getElementById("fileStatus");

    const resultBody = document.getElementById("resultBody");

    status.innerText = "회원 데이터를 불러오는 중입니다...";

    try {

        // 현재 HTML과 동일한 폴더의 member.txt

        const fileUrl = new URL("member.txt", window.location.href);

        const response = await fetch(fileUrl.href, {

            cache: "no-store"

        });

        if (!response.ok) {

            throw new Error(

                "파일 조회 실패: HTTP " + response.status

            );

        }

        const content = (await response.text())

            .replace(/^\uFEFF/, "");

        const lines = content.split(/\r?\n/);

        memberList = [];

        lines.forEach(line => {

            if (!line.trim()) return;

            const data = line.split("|");

            if (data.length < 3) return;

            const nickname = data[0].trim();

            const name = data[1].trim();

            const memberYn = data[2].trim().toUpperCase();

            if (!nickname || !name) return;

            memberList.push({

                nickname,

                name,

                memberYn

            });

        });

        if (memberList.length === 0) {

            throw new Error("회원 데이터가 0건입니다.");

        }

        dataLoaded = true;

        status.innerText =

            "회원 데이터 로드 완료 (" +

            memberList.length + "명)";

        resultBody.innerHTML =

            '<tr><td colspan="3" class="empty">' +

            '검색어를 입력해주세요.</td></tr>';

    } catch (error) {

        dataLoaded = false;

        status.innerText =

            "회원 데이터 로드 실패: " + error.message;

        resultBody.innerHTML =

            '<tr><td colspan="3" class="empty">' +

            escapeHtml(error.message) +

            '</td></tr>';

        console.error("회원 데이터 로드 오류:", error);

    }

}

// 회원 검색

function searchMember() {

    const keyword = document

        .getElementById("searchWord")

        .value.trim();

    const resultBody =

        document.getElementById("resultBody");

    const resultCount =

        document.getElementById("resultCount");

    if (!dataLoaded) {

        alert("회원 데이터가 로드되지 않았습니다.");

        return;

    }

    if (!keyword) {

        alert("검색어를 입력해주세요.");

        return;

    }

    // 쉼표 기준 다건 검색

    const keywords = keyword

        .split(",")

        .map(word => word.trim())

        .filter(Boolean);

    // 회원 검색 결과 및 미가입 검색어

    const results = [];

    const nonMembers = [];

    keywords.forEach(word => {

        const searchWord = word.toLowerCase();

        // 닉네임 또는 이름 검색

        const matchedMembers = memberList.filter(member => {

            const nickname = member.nickname.toLowerCase();

            const name = member.name.toLowerCase();

            return nickname.includes(searchWord) ||

                   name.includes(searchWord);

        });

        if (matchedMembers.length > 0) {

            // 중복 회원은 한 번만 추가

            matchedMembers.forEach(member => {

                const exists = results.some(item =>

                    item.nickname === member.nickname &&

                    item.name === member.name

                );

                if (!exists) {

                    results.push(member);

                }

            });

        } else {

            // 회원명단에 없는 검색어

            nonMembers.push(word);

        }

    });

    // 전체 결과 건수

    const totalCount = results.length + nonMembers.length;

    resultCount.innerText =

        "검색 결과 " + totalCount + "건";

    let html = "";

    // 회원 검색 결과 출력
    results.forEach(member => {

    const status = member.memberYn;

    let statusText = "준회원";
    let statusClass = "non-member";

    if (status === "S") {
        statusText = "운영진";
        statusClass = "admin";
    } else if (status === "Y") {
        statusText = "정회원";
        statusClass = "member";
    }

    html += `
        <tr>
            <td>${escapeHtml(member.nickname)}</td>
            <td>${escapeHtml(member.name)}</td>
            <td class="${statusClass}">
                ${statusText}
            </td>
        </tr>
    `;

});
    

    // 회원이 아닌 검색어를 결과 맨 아래 출력

    nonMembers.forEach(word => {

        html += `

            <tr>

                <td colspan="2" class="non-member">

                    ${escapeHtml(word)}

                </td>

                <td class="non-member">

                    회원아님

                </td>

            </tr>

        `;

    });

    // 결과가 없는 경우

    if (!html) {

        html =

            '<tr><td colspan="3" class="empty">' +

            '검색 결과가 없습니다.</td></tr>';

    }

    resultBody.innerHTML = html;

}

// HTML 특수문자 처리

function escapeHtml(value) {

    return String(value).replace(/[&<>"']/g, char => ({

        '&': '&amp;',

        '<': '&lt;',

        '>': '&gt;',

        '"': '&quot;',

        "'": '&#39;'

    })[char]);

}

// 페이지 초기화

document.addEventListener("DOMContentLoaded", function() {

    document.getElementById("searchWord")

        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                searchMember();

            }

        });

    loadMemberData();

});

</script>

</body>

</html>
